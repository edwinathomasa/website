version: 1
applications:
  - appRoot: apps/website
    frontend:
      phases:
        preBuild:
          commands:
            - npm --prefix ../.. ci --cache ../../.npm --prefer-offline
        build:
          commands:
            - npm --prefix ../.. run build --workspace=@portfolio/shared
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - ../../.npm/**/*
          - ../../node_modules/**/*
